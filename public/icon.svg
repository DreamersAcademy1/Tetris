<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Tetris Grid Accent Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="2">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Iconic Tetromino Cluster -->
  <!-- Top Block (T-piece top center) -->
  <g filter="url(#neonGlow)">
    <rect x="206" y="106" width="100" height="100" rx="14" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="3"/>
    <rect x="214" y="114" width="84" height="84" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="220" y="120" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.6"/>

    <!-- T-piece bottom left -->
    <rect x="100" y="212" width="100" height="100" rx="14" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="3"/>
    <rect x="108" y="220" width="84" height="84" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="114" y="226" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.6"/>

    <!-- T-piece bottom center -->
    <rect x="206" y="212" width="100" height="100" rx="14" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="3"/>
    <rect x="214" y="220" width="84" height="84" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="220" y="226" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.6"/>

    <!-- T-piece bottom right -->
    <rect x="312" y="212" width="100" height="100" rx="14" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="3"/>
    <rect x="320" y="220" width="84" height="84" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="326" y="226" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.6"/>

    <!-- Cyan Square Foundation Piece (left) -->
    <rect x="100" y="318" width="100" height="100" rx="14" fill="url(#cyanGrad)" stroke="#67e8f9" stroke-width="3"/>
    <rect x="108" y="326" width="84" height="84" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="114" y="332" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.6"/>

    <!-- Amber Square Foundation Piece (right) -->
    <rect x="312" y="318" width="100" height="100" rx="14" fill="url(#amberGrad)" stroke="#fde047" stroke-width="3"/>
    <rect x="320" y="326" width="84" height="84" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="326" y="332" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.6"/>
  </g>
</svg>
